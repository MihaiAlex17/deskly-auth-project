<!DOCTYPE html>
<html>
<head>
    <title>Inregistrare - AuthX</title>
</head>
<body>
    <h2>Creare Cont Angajat</h2>
    <form action="/register" method="POST">
        <input type="text" name="email" placeholder="Email sau Username" required><br><br>
        <input type="password" name="password" placeholder="Parola" required><br><br>
        <button type="submit">Creeaza Cont</button>
    </form>
    <br>
    <a href="/login">Ai deja cont? Logheaza-te aici.</a>
</body>
</html>
