<!DOCTYPE html>
<html>
<head>
    <title>AuthX - Register</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #2ecc71; }
        a { color: #3498db; text-decoration: none; font-size: 0.85rem; display: block; margin-top: 20px; }
        a:hover { text-decoration: underline; }

        /* Stil pentru mesaje flash */
        .alert {
            padding: 10px;
            margin-bottom: 1rem;
            border-radius: 4px;
            font-size: 0.85rem;
            text-align: left;
        }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Creare Cont</h2>

        <!-- Sectiune Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category if category else 'danger' }}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/register" method="POST">
            <input type="text" name="email" placeholder="Email sau Username" required>
            <input type="password" name="password" placeholder="Parola" required>
            <button type="submit">Inregistrare</button>
        </form>
        <a href="/login">Inapoi la Login</a>
    </div>
</body>
</html>
