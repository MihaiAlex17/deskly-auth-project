<!DOCTYPE html>
<html>
<head>
    <title>AuthX - Reset Password</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 0.5rem; }
        .user-info { color: #e67e22; font-weight: bold; margin-bottom: 1.5rem; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #e67e22; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Parola Noua</h2>
        <div class="user-info">Utilizator: {{ email }}</div>
        <form method="POST">
            <input type="password" name="password" placeholder="Introdu noua parola" required>
            <button type="submit">Actualizeaza Parola</button>
        </form>
    </div>
</body>
</html>
