<!DOCTYPE html>
<html>
<head>
    <title>AuthX - Login</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #34495e; }
        .links { margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
        a { color: #3498db; text-decoration: none; font-size: 0.85rem; display: block; margin-top: 8px; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Autentificare</h2>
        <form action="/login" method="POST">
            <input type="text" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Parola" required>
            <button type="submit">Login</button>
        </form>
        <div class="links">
            <a href="/register">Nu ai cont? Inregistreaza-te</a>
            <a href="/forgot-password">Ai uitat parola?</a>
        </div>
    </div>
</body>
</html>
