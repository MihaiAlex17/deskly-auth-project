<!DOCTYPE html>
<html>
<head>
    <title>AuthX - Forgot Password</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 1rem; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        a { color: #3498db; text-decoration: none; font-size: 0.85rem; display: block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Recuperare</h2>
        <p>Introdu email-ul pentru a genera link-ul de resetare.</p>
        <form action="/forgot-password" method="POST">
            <input type="email" name="email" placeholder="Email angajat" required>
            <button type="submit">Genereaza Link</button>
        </form>
        <a href="/login">Inapoi la Login</a>
    </div>
</body>
</html>
